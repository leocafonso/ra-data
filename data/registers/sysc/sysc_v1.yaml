    byte_offset: 1170
    bit_size: 8
fieldset/LOCOCR:
  description: Low-Speed On-Chip Oscillator Control Register.
  bit_size: 8
  fields:
  - name: LCSTP
    description: 'LOCO Stop.

      0: Operate the LOCO clock.

      1: Stop the LOCO clock.

      '
    bit_offset: 0
    bit_size: 1
fieldset/MOMCR:
  description: Main Clock Oscillator Mode Oscillation Control Register.
  bit_size: 8
  fields:
  - name: MODRV1
    description: 'Main Clock Oscillator Drive Capability 1 Switching.

      0: 10 MHz to 20 MHz.

      1: 1 MHz to 10 MHz.

      '
    bit_offset: 3
    bit_size: 1
  - name: MOSEL
    description: 'Main Clock Oscillator Switching.

      0: Resonator.

      1: External clock input.

      '
    bit_offset: 6
    bit_size: 1
fieldset/RSTSR0:
  description: Reset Status Register 0.
  bit_size: 8
  fields:
  - name: PORF
    description: 'Power-On Reset Detect Flag.

      0: Power-on reset not detected.

      1: Power-on reset detected.

      '
    bit_offset: 0
    bit_size: 1
  - name: LVD0RF
    description: 'Voltage Monitor 0 Reset Detect Flag.

      0: Voltage monitor 0 reset not detected.

      1: Voltage monitor 0 reset detected.

      '
    bit_offset: 1
    bit_size: 1
  - name: LVD1RF
    description: 'Voltage Monitor 1 Reset Detect Flag.

      0: Voltage monitor 1 reset not detected.

      1: Voltage monitor 1 reset detected.

      '
    bit_offset: 2
    bit_size: 1
  - name: LVD2RF
    description: 'Voltage Monitor 2 Reset Detect Flag.

      0: Voltage monitor 2 reset not detected.

      1: Voltage monitor 2 reset detected.

      '
    bit_offset: 3
    bit_size: 1
fieldset/RSTSR2:
  description: Reset Status Register 2.
  bit_size: 8
  fields:
  - name: CWSF
    description: 'Cold/Warm Start Determination Flag.

      0: Cold start.

      1: Warm start.

      '
    bit_offset: 0
    bit_size: 1
fieldset/SOMCR:
  description: Sub-Clock Oscillator Mode Control Register.
  bit_size: 8
  fields:
  - name: SODRV
    description: Sub-Clock Oscillator Drive Capability Switching.
    bit_offset: 0
    bit_size: 2
    enum: SODRV
fieldset/SOSCCR:
  description: Sub-Clock Oscillator Control Register.
  bit_size: 8
  fields:
  - name: SOSTP
    description: 'Sub Clock Oscillator Stop.

      0: Operate the sub-clock oscillator.

      1: Stop the sub-clock oscillator.

      '
    bit_offset: 0
    bit_size: 1
fieldset/SYOCDCR:
  description: System Control OCD Control Register.
  bit_size: 8
  fields:
  - name: DBGEN
    description: 'Debugger Enable bit.

      0: On-chip debugger is disabled.

      1: On-chip debugger is enabled.

      '
    bit_offset: 7
    bit_size: 1
fieldset/CKOCR:
  bit_size: 8
  fields:
  - name: CKOSEL
    description: Clock Out Source Select.
    bit_offset: 0
    bit_size: 3
    enum: CKOSEL
  - name: CKODIV
    description: Clock Output Frequency Division Ratio.
    bit_offset: 4
    bit_size: 3
    enum: CKODIV
  - name: CKOEN
    description: 'Clock Out Enable.

      0: Disable clock out.

      1: Enable clock out.

      '
    bit_offset: 7
    bit_size: 1
fieldset/HOCOCR:
  description: High-Speed On-Chip Oscillator Control Register.
  bit_size: 8
  fields:
  - name: HCSTP
    description: 'HOCO Stop.

      0: Operate the HOCO clock.

      1: Stop the HOCO clock.

      '
    bit_offset: 0
    bit_size: 1
fieldset/HOCOWTCR:
  description: High-Speed On-Chip Oscillator Wait Control Register.
  bit_size: 8
  fields:
  - name: HSTS
    description: HOCO Wait Time Setting.
    bit_offset: 0
    bit_size: 3
    enum: HSTS
fieldset/LPOPT:
  description: Lower Power Operation Control Register.
  bit_size: 8
  fields:
  - name: MPUDIS
    description: 'MPU Clock Disable Control.

      0: MPU operates as normal.

      1: MPU operating clock stops (MPU function disable).

      '
    bit_offset: 0
    bit_size: 1
  - name: DCLKDIS
    description: Debug Clock Disable Control.
    bit_offset: 1
    bit_size: 2
    enum: DCLKDIS
  - name: BPFCLKDIS
    description: 'BPF Clock Disable Control.

      0: Flash register R/W clock operates as normal.

      1: Flash register R/W clock stops.

      '
    bit_offset: 3
    bit_size: 1
  - name: LPOPTEN
    description: 'Lower Power Operation Enable.

      0: All lower power countermeasure disable.

      1: All lower power countermeasure enable.

      '
    bit_offset: 7
    bit_size: 1
fieldset/LVCMPCR:
  description: Voltage Monitor Circuit Control Register.
  bit_size: 8
  fields:
  - name: LVD1E
    description: 'Voltage Detection 1 Enable.

      0: Voltage detection 1 circuit disabled.

      1: Voltage detection 1 circuit enabled.

      '
    bit_offset: 5
    bit_size: 1
  - name: LVD2E
    description: 'Voltage Detection 2 Enable.

      0: Voltage detection 2 circuit disabled.

      1: Voltage detection 2 circuit enabled.

      '
    bit_offset: 6
    bit_size: 1
fieldset/LVD1CR0:
  description: Voltage Monitor 1 Circuit Control Register 0.
  bit_size: 8
  fields:
  - name: RIE
    description: 'Voltage Monitor 1 Interrupt/Reset Enable.

      0: Disable.

      1: Enable.

      '
    bit_offset: 0
    bit_size: 1
  - name: CMPE
    description: 'Voltage Monitor 1 Circuit Comparison Result Output Enable.

      0: Disable voltage monitor 1 circuit comparison result output.

      1: Enable voltage monitor 1 circuit comparison result output.

      '
    bit_offset: 2
    bit_size: 1
  - name: RI
    description: 'Voltage Monitor 1 Circuit Mode Select.

      0: Generate voltage monitor 1 interrupt on Vdet1 crossing.

      1: Enable voltage monitor 1 reset when the voltage falls to and below Vdet1.

      '
    bit_offset: 6
    bit_size: 1
  - name: RN
    description: 'Voltage Monitor 1 Reset Negate Select.

      0: Negate after a stabilization time (tLVD1) when VCC > Vdet1 is detected.

      1: Negate after a stabilization time (tLVD1) on assertion of the LVD1 reset.

      '
    bit_offset: 7
    bit_size: 1
fieldset/LVD1CR1:
  description: Voltage Monitor 1 Circuit Control Register.
  bit_size: 8
  fields:
  - name: IDTSEL
    description: Voltage Monitor 1 Interrupt Generation Condition Select.
    bit_offset: 0
    bit_size: 2
    enum: LVD1CR1_IDTSEL
  - name: IRQSEL
    description: 'Voltage Monitor 1 Interrupt Type Select.

      0: Non-maskable interrupt.

      1: Maskable interrupt.

      '
    bit_offset: 2
    bit_size: 1
fieldset/LVD1SR:
  description: Voltage Monitor 1 Circuit Status Register.
  bit_size: 8
  fields:
  - name: DET
    description: 'Voltage Monitor 1 Voltage Variation Detection Flag.

      0: Not detected.

      1: Vdet1 crossing is detected.

      '
    bit_offset: 0
    bit_size: 1
  - name: MON
    description: 'Voltage Monitor 1 Signal Monitor Flag.

      0: VCC < Vdet1.

      1: VCC >= Vdet1 or MON is disabled.

      '
    bit_offset: 1
    bit_size: 1
fieldset/LVD2CR0:
  description: Voltage Monitor 2 Circuit Control Register 0.
  bit_size: 8
  fields:
  - name: RIE
    description: 'Voltage Monitor 2 Interrupt/Reset Enable.

      0: Disable.

      1: Enable.

      '
    bit_offset: 0
    bit_size: 1
  - name: CMPE
    description: 'Voltage Monitor 2 Circuit Comparison Result Output Enable.

      0: Disable voltage monitor 2 circuit comparison result output.

      1: Enable voltage monitor 2 circuit comparison result output.

      '
    bit_offset: 2
    bit_size: 1
  - name: RI
    description: 'Voltage Monitor 2 Circuit Mode Select.

      0: Generate voltage monitor 2 interrupt on Vdet2 crossing.

      1: Enable voltage monitor 2 reset when the voltage falls to and below Vdet2.

      '
    bit_offset: 6
    bit_size: 1
  - name: RN
    description: 'Voltage Monitor 2 Reset Negate Select.

      0: Negate after a stabilization time (tLVD2) when VCC > Vdet2 is detected.

      1: Negate after a stabilization time (tLVD2) on assertion of the LVD2 reset.

      '
    bit_offset: 7
    bit_size: 1
fieldset/LVD2CR1:
  description: Voltage Monitor 2 Circuit Control Register 1.
  bit_size: 8
  fields:
  - name: IDTSEL
    description: Voltage Monitor 2 Interrupt Generation Condition Select.
    bit_offset: 0
    bit_size: 2
    enum: LVD2CR1_IDTSEL
  - name: IRQSEL
    description: 'Voltage Monitor 2 Interrupt Type Select.

      0: Non-maskable interrupt.

      1: Maskable interrupt.

      '
    bit_offset: 2
    bit_size: 1
fieldset/LVD2SR:
  description: Voltage Monitor 2 Circuit Status Register.
  bit_size: 8
  fields:
  - name: DET
    description: 'Voltage Monitor 2 Voltage Variation Detection Flag.

      0: Not detected.

      1: Vdet2 crossing is detected.

      '
    bit_offset: 0
    bit_size: 1
  - name: MON
    description: 'Voltage Monitor 2 Signal Monitor Flag.

      0: VCC < Vdet2.

      1: VCC >= Vdet2 or MON is disabled.

      '
    bit_offset: 1
    bit_size: 1
fieldset/LVDLVLR:
  description: Voltage Detection Level Select Register.
  bit_size: 8
  fields:
  - name: LVD1LVL
    description: Voltage Detection 1 Level Select (Standard voltage during fall in voltage).
    bit_offset: 0
    bit_size: 5
    enum: LVD1LVL
  - name: LVD2LVL
    description: Voltage Detection 2 Level Select (Standard voltage during fall in voltage).
    bit_offset: 5
    bit_size: 3
    enum: LVD2LVL
fieldset/MEMWAIT:
  description: Memory Wait Cycle Control Register for Code Flash.
  bit_size: 8
  fields:
  - name: MEMWAIT
    description: 'Memory Wait Cycle Select for Code Flash.

      0: No wait.

      1: Wait.

      '
    bit_offset: 0
    bit_size: 1
fieldset/MOCOCR:
  description: Middle-Speed On-Chip Oscillator Control Register.
  bit_size: 8
  fields:
  - name: MCSTP
    description: 'MOCO Stop.

      0: MOCO clock is operating.

      1: MOCO clock is stopped.

      '
    bit_offset: 0
    bit_size: 1
fieldset/MOSCCR:
  description: Main Clock Oscillator Control Register.
  bit_size: 8
  fields:
  - name: MOSTP
    description: 'Main Clock Oscillator Stop.

      0: Operate the main clock oscillator.

      1: Stop the main clock oscillator.

      '
    bit_offset: 0
    bit_size: 1
fieldset/MOSCWTCR:
  description: Main Clock Oscillator Wait Control Register.
  bit_size: 8
  fields:
  - name: MSTS
    description: Main Clock Oscillator Wait Time Setting.
    bit_offset: 0
    bit_size: 4
    enum: MSTS
fieldset/MSTPCRA:
  description: Module Stop Control Register A.
  fields:
  - name: MSTPA
    description: 'DTC Module Stop.

      0: Cancel the module-stop state.

      1: Enter the module-stop state.

      '
    bit_offset: 22
    bit_size: 1
    array:
      len: 1
      stride: 0
fieldset/OPCCR:
  description: Operating Power Control Register.
  bit_size: 8
  fields:
  - name: OPCM
    description: Operating Power Control Mode Select.
    bit_offset: 0
    bit_size: 2
    enum: OPCM
  - name: OPCMTSF
    description: 'Operating Power Control Mode Transition Status Flag.

      0: Transition completed.

      1: During transition.

      '
    bit_offset: 4
    bit_size: 1
fieldset/OSCSF:
  description: Oscillation Stabilization Flag Register.
  bit_size: 8
  fields:
  - name: HOCOSF
    description: 'HOCO Clock Oscillation Stabilization Flag.

      0: The HOCO clock is stopped or is not yet stable.

      1: The HOCO clock is stable, so is available for use as the system clock.

      '
    bit_offset: 0
    bit_size: 1
  - name: MOSCSF
    description: 'Main Clock Oscillation Stabilization Flag.

      0: The main clock oscillator is stopped (MOSTP = 1) or is not yet stable.

      1: The main clock oscillator is stable, so is available for use as the system clock.

      '
    bit_offset: 3
    bit_size: 1
fieldset/OSTDCR:
  description: Oscillation Stop Detection Control Register.
  bit_size: 8
  fields:
  - name: OSTDIE
    description: 'Oscillation Stop Detection Interrupt Enable.

      0: Disable oscillation stop detection interrupt (do not notify the POEG).

      1: Enable oscillation stop detection interrupt (notify the POEG).

      '
    bit_offset: 0
    bit_size: 1
  - name: OSTDE
    description: 'Oscillation Stop Detection Function Enable.

      0: Disable oscillation stop detection function.

      1: Enable oscillation stop detection function.

      '
    bit_offset: 7
    bit_size: 1
fieldset/OSTDSR:
  description: Oscillation Stop Detection Status Register.
  bit_size: 8
  fields:
  - name: OSTDF
    description: 'Oscillation Stop Detection Flag.

      0: Main clock oscillation stop not detected.

      1: Main clock oscillation stop detected.

      '
    bit_offset: 0
    bit_size: 1
fieldset/PRCR:
  description: Protect Register.
  bit_size: 16
  fields:
  - name: PRC0
    description: 'Enable writing to the registers related to the clock generation circuit.

      0: Disable writes.

      1: Enable writes.

      '
    bit_offset: 0
    bit_size: 1
  - name: PRC1
    description: 'Enable writing to the registers related to the low power modes.

      0: Disable writes.

      1: Enable writes.

      '
    bit_offset: 1
    bit_size: 1
  - name: PRC3
    description: 'Enable writing to the registers related to the LVD.

      0: Disable writes.

      1: Enable writes.

      '
    bit_offset: 3
    bit_size: 1
  - name: PRKEY
    description: PRC Key Code.
    bit_offset: 8
    bit_size: 8
fieldset/PSMCR:
  description: Power Save Memory Control Register.
  bit_size: 8
  fields:
  - name: PSMC
    description: Power Save Memory Control.
    bit_offset: 0
    bit_size: 2
    enum: PSMC
fieldset/RSTSR1:
  description: Reset Status Register 1.
  bit_size: 16
  fields:
  - name: IWDTRF
    description: 'Independent Watchdog Timer Reset Detect Flag.

      0: Independent watchdog timer reset not detected.

      1: Independent watchdog timer reset detected.

      '
    bit_offset: 0
    bit_size: 1
  - name: WDTRF
    description: 'Watchdog Timer Reset Detect Flag.

      0: Watchdog timer reset not detected.

      1: Watchdog timer reset detected.

      '
    bit_offset: 1
    bit_size: 1
  - name: SWRF
    description: 'Software Reset Detect Flag.

      0: Software reset not detected.

      1: Software reset detected.

      '
    bit_offset: 2
    bit_size: 1
  - name: RPERF
    description: 'SRAM Parity Error Reset Detect Flag.

      0: SRAM parity error reset not detected.

      1: SRAM parity error reset detected.

      '
    bit_offset: 8
    bit_size: 1
  - name: BUSSRF
    description: 'Bus Slave MPU Error Reset Detect Flag.

      0: Bus slave MPU error reset not detected.

      1: Bus slave MPU error reset detected.

      '
    bit_offset: 10
    bit_size: 1
  - name: BUSMRF
    description: 'Bus Master MPU Error Reset Detect Flag.

      0: Bus master MPU error reset not detected.

      1: Bus master MPU error reset detected.

      '
    bit_offset: 11
    bit_size: 1
  - name: SPERF
    description: 'CPU Stack Pointer Error Reset Detect Flag.

      0: CPU stack pointer error reset not detected.

      1: CPU stack pointer error reset detected.

      '
    bit_offset: 12
    bit_size: 1
fieldset/SBYCR:
  description: Standby Control Register.
  bit_size: 16
  fields:
  - name: SSBY
    description: 'Software Standby Mode Select.

      0: Sleep mode.

      1: Software Standby mode.

      '
    bit_offset: 15
    bit_size: 1
fieldset/SCKDIVCR:
  description: System Clock Division Control Register.
  fields:
  - name: PCKD
    description: Peripheral Module Clock D (PCLKD) Select.
    bit_offset: 0
    bit_size: 3
    enum: PCKD
  - name: PCKC
    description: Peripheral Module Clock C (PCLKC) Select.
    bit_offset: 4
    bit_size: 3
    enum: PCKC
  - name: PCKB
    description: Peripheral Module Clock B (PCLKB) Select.
    bit_offset: 8
    bit_size: 3
    enum: PCKB
  - name: PCKA
    description: Peripheral Module Clock A (PCLKA) Select.
    bit_offset: 12
    bit_size: 3
    enum: PCKA
  - name: ICK
    description: System Clock (ICLK) Select.
    bit_offset: 24
    bit_size: 3
    enum: ICK
  - name: FCK
    description: System Clock (ICLK) Select.
    bit_offset: 28
    bit_size: 3
    enum: FCK
fieldset/SCKSCR:
  description: System Clock Source Control Register.
  bit_size: 8
  fields:
  - name: CKSEL
    description: Clock Source Select.
    bit_offset: 0
    bit_size: 3
    enum: CKSEL
fieldset/SNZCR:
  description: Snooze Control Register.
  bit_size: 8
  fields:
  - name: RXDREQEN
    description: 'RXD0 Snooze Request Enable.

      0: Ignore RXD0 falling edge in Software Standby mode.

      1: Detect RXD0 falling edge in Software Standby mode.

      '
    bit_offset: 0
    bit_size: 1
  - name: SNZDTCEN
    description: 'DTC Enable in Snooze mode.

      0: Disable DTC operation.

      1: Enable DTC operation.

      '
    bit_offset: 1
    bit_size: 1
  - name: SNZE
    description: 'Snooze mode Enable.

      0: Disable Snooze mode.

      1: Enable Snooze mode.

      '
    bit_offset: 7
    bit_size: 1
fieldset/SNZEDCR0:
  description: Snooze End Control Register 0.
  bit_size: 8
  fields:
  - name: AGTUNFED
    description: 'AGT1 Underflow Snooze End Enable.

      0: Disable the snooze end request.

      1: Enable the snooze end request.

      '
    bit_offset: 0
    bit_size: 1
  - name: DTCZRED
