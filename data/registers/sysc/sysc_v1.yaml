fieldset/SBYCR:
  description: Standby Control Register.
  bit_size: 16
  fields:
  - name: Reserved
    description: These bits are read as 000000000000000. The write value should be 000000000000000.
    bit_offset: 0
    bit_size: 15
  - name: SSBY
    description: Software Standby
    bit_offset: 15
    bit_size: 1
fieldset/MSTPCRA:
  description: Module Stop Control Register A.
  bit_size: 32
  fields:
  - name: Reserved
    description: These bits are read as 1111111111111111111111. The write value should be 1111111111111111111111.
    bit_offset: 0
    bit_size: 22
  - name: MSTPA22
    description: Data Transfer Controller Module Stop
    bit_offset: 22
    bit_size: 1
  - name: Reserved
    description: These bits are read as 111111111. The write value should be 111111111.
    bit_offset: 23
    bit_size: 9
